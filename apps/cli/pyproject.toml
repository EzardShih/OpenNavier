[project]
name = "opennavier-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "opennavier-core",
    "opennavier-openfoam",
    "typer>=0.12.0",
]

[project.scripts]
opennavier = "opennavier.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opennavier"]
