[project]
name = "opennavier-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "opennavier-core",
    "opennavier-openfoam",
]

[project.scripts]
opennavier-mcp = "opennavier.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opennavier"]
