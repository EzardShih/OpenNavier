name: Checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Python dependencies
        run: uv sync

      - name: Run Ruff
        run: uv run ruff check . --no-cache

      - name: Run pytest
        run: uv run pytest

  studio:
    name: Studio
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Install Studio dependencies
        run: npm --prefix apps/studio ci

      - name: Run Studio checks
        run: npm --prefix apps/studio run check
