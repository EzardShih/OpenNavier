[project]
name = "opennavier"
version = "0.1.0"
description = "Local-first OpenFOAM automation and diagnostics CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opennavier-cli",
    "opennavier-freecad",
    "opennavier-gmsh",
    "opennavier-mcp",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/cli",
    "packages/core",
    "packages/freecad",
    "packages/gmsh",
    "packages/mcp",
    "packages/openfoam",
]

[tool.uv.sources]
opennavier-cli = { workspace = true }
opennavier-core = { workspace = true }
opennavier-freecad = { workspace = true }
opennavier-gmsh = { workspace = true }
opennavier-mcp = { workspace = true }
opennavier-openfoam = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
cache_dir = ".tmp/pytest-cache"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
